name: setup token (初回のトークン取得)

# ブラウザだけでアクセストークンを取得し、Secret に直接登録する（トークンは画面に出ない）。
# 事前準備（docs/token-setup.md）:
#   Variables: THREADS_APP_ID, THREADS_REDIRECT_URI（省略時 https://localhost/）
#   Secrets  : THREADS_APP_SECRET, GH_SECRETS_PAT（このリポジトリの Secrets: Read and write）
on:
  workflow_dispatch:
    inputs:
      code:
        description: "許可後に表示された https://localhost/?code=... のURL全体（1時間以内・1回限り有効）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check prerequisites
        env:
          APP_ID: ${{ vars.THREADS_APP_ID }}
          APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          missing=""
          [ -z "$APP_ID" ] && missing="$missing Variables:THREADS_APP_ID"
          [ -z "$APP_SECRET" ] && missing="$missing Secrets:THREADS_APP_SECRET"
          [ -z "$GH_TOKEN" ] && missing="$missing Secrets:GH_SECRETS_PAT"
          if [ -n "$missing" ]; then echo "::error::未登録です:$missing（docs/token-setup.md 参照）"; exit 1; fi
      - name: Exchange code for long-lived token
        env:
          THREADS_APP_ID: ${{ vars.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_REDIRECT_URI: ${{ vars.THREADS_REDIRECT_URI }}
          CODE_INPUT: ${{ inputs.code }}
        run: python -m threads_auto get-token --code "$CODE_INPUT" --output "$RUNNER_TEMP/token.json"
      - name: Save to repository secrets
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          read_field() { python -c "import json,sys;print(json.load(open(sys.argv[1]))[sys.argv[2]],end='')" "$RUNNER_TEMP/token.json" "$1"; }
          read_field access_token | gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          read_field user_id | gh secret set THREADS_USER_ID --repo "$GITHUB_REPOSITORY"
          rm -f "$RUNNER_TEMP/token.json"
          echo "THREADS_ACCESS_TOKEN / THREADS_USER_ID を登録しました。" >> "$GITHUB_STEP_SUMMARY"

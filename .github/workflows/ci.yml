name: ci

on:
  push:
    paths-ignore: ["data/posted/**", "data/metrics/**", "data/reports/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - name: Validate queue
        run: python -m threads_auto validate
